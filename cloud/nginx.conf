pid /tmp/editorial-nginx.pid;
error_log /dev/null;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  access_log off;
  client_body_temp_path /tmp/nginx-client;
  proxy_temp_path /tmp/nginx-proxy;
  server {
    listen 8080;
    server_name _;
    auth_basic "Editorial";
    auth_basic_user_file /tmp/editorial.htpasswd;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    location = /healthz { auth_basic off; proxy_pass http://127.0.0.1:8788; }
    location /desktop/ {
      alias /usr/share/novnc/;
      index vnc.html;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;
    }
    location /websockify {
      proxy_pass http://127.0.0.1:6080;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 4h;
    }
    location / {
      proxy_pass http://127.0.0.1:8788;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_read_timeout 600s;
    }
  }
}
